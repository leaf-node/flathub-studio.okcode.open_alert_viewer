id: studio.okcode.open_alert_viewer
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: open_alert_viewer
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  - --talk-name=org.freedesktop.Notifications
modules:
  - name: open_alert_viewer
    buildsystem: simple
    build-commands:
      - cp -R bundle/* /app/
      - mkdir /app/bin/
      - ln -s ../open_alert_viewer /app/bin/open_alert_viewer
      - install -Dm644 sources/assets/icon/open_alert_viewer_circle_footprint.svg /app/share/icons/hicolor/scalable/apps/studio.okcode.open_alert_viewer.svg
      - install -Dm644 sources/linux/oav-custom/studio.okcode.open_alert_viewer.desktop /app/share/applications/studio.okcode.open_alert_viewer.desktop
      - install -Dm644 sources/linux/oav-custom/studio.okcode.open_alert_viewer.metainfo.xml /app/share/metainfo/studio.okcode.open_alert_viewer.metainfo.xml
    sources:
      - type: archive
        url: https://codeberg.org/leaf-node/open_alert_viewer/archive/v1.3.5.tar.gz
        sha256: 155f0538782139deac2deae58b864fdd7f50e4f19a81c0cd8f45968d269c5cb9
        dest: sources
      - type: archive
        only-arches:
          - x86_64
        url: https://codeberg.org/leaf-node/open_alert_viewer/releases/download/v1.3.5/oav-bundle-ubuntu-resolute-x86_64.tar.gz
        sha256: ab31bf147c7c9840759ef9527df84b7807877912ca61738c22fe3008244498e9
        dest: bundle
      - type: archive
        only-arches:
          - aarch64
        url: https://codeberg.org/leaf-node/open_alert_viewer/releases/download/v1.3.5/oav-bundle-ubuntu-resolute-aarch64.tar.gz
        sha256: 4b8ea0f615c078066a3345644583e355a9d62b7581424b5600d8b9c85c4a6a67
        dest: bundle
